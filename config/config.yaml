# indooruav_waypoint 功能包统一配置
# 该 yaml 由 launch 文件以 rosparam load 方式加载到节点的私有命名空间

indooruav_waypoint:

  # ============================================================
  # 航点跟踪器：waypoint_tracker_node
  # ============================================================
  waypoint_tracker:

    # ----- 话题 -----
    topics:
      # 订阅的实时里程计话题（与 position_controller 保持一致）
      current_odometry: /Odometry_global
      # 发布的目标里程计话题（当前正在追踪的航点，阶跃信号，用于可视化/调试）
      desired_odometry: indooruav_controller/waypoint_tracker/odom_goal
      # 发布的速度指令话题
      velocity_command: indooruav_controller/waypoint_tracker/cmd_vel

    # ----- 服务 -----
    services:
      # 启动追踪
      start: indooruav_controller/waypoint_tracker/start
      # 暂停追踪（保留当前航点索引）
      pause: indooruav_controller/waypoint_tracker/pause
      # 关闭追踪并复位（航点索引归零）
      stop: indooruav_controller/waypoint_tracker/stop
      cruise_complete: indooruav_core/state_machine_event/cruise_complete

    # ----- 航点文件路径 -----
    # 相对路径会以 waypoints_package_name 为根解析；绝对路径直接使用
    waypoints_package_name: indooruav_waypoint
    waypoints_file_path: config/waypoints.yaml

    # ----- 控制器基本参数 -----
    parameters:
      # 控制频率
      control_rate_hz: 30.0
      # 实时里程计超时阈值，超过则发送一次零速指令并将限幅器清零
      odometry_timeout_s: 0.2
      # 节点启动后是否自动进入 RUNNING 状态。false 时需手动调用 start 服务
      autostart: false

      # 巡航速度（速度上限，同时也是限幅器 v_max）
      xy_speed_mps: 0.5    # XY 合速度
      z_speed_mps: 0.2      # Z 速度
      yaw_speed_dps: 10.0   # Yaw 速度（°/s），同时作用于旋转阶段与保持阶段

      # ============================================================
      # 两阶段流程（每个航点均执行）：
      #   阶段1 PHASE_ROTATE：原地把 yaw 转到目标 yaw（xy/z 速度为 0），
      #                       使用 kp_yaw_rotate（较大），加快旋转。
      #   阶段2 PHASE_MOVE  ：xy 与 z 同时收敛到目标位置，
      #                       yaw 用 kp_yaw_hold（较小）保持目标 yaw，避免长距离漂航。
      # 阶段1→阶段2 切换阈值：yaw_rotation_tolerance_deg
      # 到达判定（阶段2 结束）：xy_arrival_tolerance_m && z_arrival_tolerance_m
      #                       && (ignore_arrival_yaw || yaw_arrival_tolerance_deg)
      # ============================================================

      # 位置 P 反馈增益：速度幅值 = min(v_max, sqrt(2·a·d), Kp·d)
      kp_xy: 0.5             # 单位 1/s，作用于阶段2 的 XY 距离误差
      kp_z: 0.3               # 单位 1/s，作用于阶段2 的 Z 距离误差
      kp_yaw_rotate: 1.0      # 单位 1/s，阶段1 原地旋转用（大 P，快速转向）
      kp_yaw_hold: 0.1        # 单位 1/s，阶段2 航向保持用（小 P，缓慢修正漂航）

      # 三阶速率限幅参数（snap 设大值即退化为二阶）
      xy_accel_max_mps2: 0.5
      xy_jerk_max_mps3: 2.0
      xy_snap_max_mps4: 1.0e6

      z_accel_max_mps2: 0.4
      z_jerk_max_mps3: 2.0
      z_snap_max_mps4: 1.0e6

      yaw_accel_max_dps2: 60.0
      yaw_jerk_max_dps3: 300.0
      yaw_snap_max_dps4: 1.0e6

      # ----- 容差 -----
      # 阶段1 → 阶段2 切换阈值：|yaw_err| 小于该值即认为旋转完成
      # 通常可放宽，避免末端在阶段1 反复抖动
      yaw_rotation_tolerance_deg: 5.0

      # 到达判定阈值（一个航点结束）
      xy_arrival_tolerance_m: 0.1
      z_arrival_tolerance_m: 0.1
      # 当 ignore_arrival_yaw=false 时还需要 yaw 落入此容差才判定到达
      yaw_arrival_tolerance_deg: 5.0

      # 到达判定是否忽略 yaw：
      #   true  -> 只看 xy 与 z 容差（默认，更不易因 yaw 微抖卡在最后一段）
      #   false -> 还需要 yaw 也落入 yaw_arrival_tolerance_deg
      ignore_arrival_yaw: true

  # ============================================================
  # 航点录制器：waypoint_recorder_node
  # ============================================================
  waypoint_recorder:

    # ----- 工作模式 -----
    # "direct"     直接订阅里程计话题（默认）
    # "path_relay" 订阅 /global_path 路径，取最新帧转为 Odometry 发布到 odometry_path 话题
    mode: direct

    # ----- 话题 -----
    topics:
      # mode=direct 时订阅的里程计话题（与 tracker 订阅同一个话题，确保坐标系一致）
      current_odometry: /Odometry_global
      # mode=path_relay 时订阅的全局路径话题
      global_path: /global_path
      # mode=path_relay 时将路径转为 Odometry 发布到该话题
      odometry_path: /Odometry_path

    # ----- 服务 -----
    services:
      # 触发记录当前位置为新航点
      record: indooruav_controller/waypoint_recorder/record
      # 触发将内存中的航点列表整文件覆盖写入 YAML
      save: indooruav_controller/waypoint_recorder/save
      # 触发清空内存中的航点列表
      clear: indooruav_controller/waypoint_recorder/clear

    # ----- 航点保存路径 -----
    # 相对路径会以 waypoints_package_name 为根解析；绝对路径直接使用
    waypoints_package_name: indooruav_waypoint
    waypoints_file_path: config/waypoints.yaml

    # ----- 录制器基本参数 -----
    parameters:
      # 节点启动时如果目标文件已存在，是否在内存中预加载（true 续录、false 从空开始）
      load_existing: false
